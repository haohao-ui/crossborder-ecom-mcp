name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: crossborder-ecom-mcp-linux-amd64
            binary_name: crossborder-ecom-mcp
            strip: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: crossborder-ecom-mcp-linux-arm64
            binary_name: crossborder-ecom-mcp
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: crossborder-ecom-mcp-darwin-amd64
            binary_name: crossborder-ecom-mcp
            strip: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: crossborder-ecom-mcp-darwin-arm64
            binary_name: crossborder-ecom-mcp
            strip: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: crossborder-ecom-mcp-windows-amd64
            binary_name: crossborder-ecom-mcp.exe
            strip: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ "${{ matrix.strip }}" = "true" ]; then
            strip "$BIN_PATH" || true
          fi
          ARCHIVE="${{ matrix.artifact_name }}.tar.gz"
          tar -czvf "$ARCHIVE" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $archive = "${{ matrix.artifact_name }}.zip"
          Compress-Archive -Path $binPath -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "${archive}.sha256" -Encoding utf8
        shell: pwsh

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
