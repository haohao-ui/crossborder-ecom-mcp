[package]
name = "crossborder-ecom-mcp"
version = "0.1.0"
edition = "2021"
description = "跨境出海电商产品信息获取与监控 MCP 服务 (Amazon, Shopify)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "socks", "gzip", "brotli", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
once_cell = "1.20"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
url = "2.5"
